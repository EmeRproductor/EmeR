const labels={inicio:'Inicio',ventas:'Ventas',caja:'Caja esencial',comandas:'Garzón / comandas',cocina:'Visualización cocina',egresos:'Egresos simples',productos:'Productos / inventario',reportes:'Reportes esenciales',config:'Configuración general',trazabilidad:'Trazabilidad base'};

function Btn({children,onClick,kind='cyan',disabled}){return <button disabled={disabled} onClick={onClick} className={`rounded-xl px-4 py-2 font-black text-sm transition active:scale-95 disabled:opacity-40 ${kind==='dark'?'bg-slate-950 text-white':kind==='orange'?'bg-[#c46e08] text-white':kind==='red'?'bg-red-600 text-white':kind==='green'?'bg-emerald-600 text-white':'bg-[#0ea7ad] text-white'}`}>{children}</button>}

function Login({setRole}){const [u,setU]=useState('ADMIN'),[p,setP]=useState('123'),[show,setShow]=useState(false),[msg,setMsg]=useState('');return <div className="tech relative min-h-screen p-6"><div className="relative mx-auto grid max-w-6xl min-h-[90vh] items-center gap-8 lg:grid-cols-2"><div className="rounded-[2.5rem] bg-white/85 p-8 shadow-2xl backdrop-blur text-center"><img src={LOGO} className="floatLogo mx-auto h-36 w-36 rounded-[2rem] object-contain bg-white p-2 shadow-xl"/><h1 className="bevel mt-4 text-5xl font-black">La Picá de Picaflor</h1><p className="mt-3 font-semibold text-slate-600">Software de gestión comercial y operativa para restaurante.</p><div className="mt-6 grid grid-cols-3 gap-2">{Object.keys(roles).map(r=><div className="rounded-2xl bg-slate-950 p-3 text-white font-black" key={r}>{r}</div>)}</div><p className="mt-6 text-xs font-bold uppercase tracking-[.22em] text-slate-400">Software creado por Emerson Gil</p></div><div className="rounded-[2.5rem] bg-white/90 p-8 shadow-2xl backdrop-blur"><h2 className="text-3xl font-black">Iniciar sesión</h2><div className="mt-5 grid grid-cols-3 gap-2">{Object.keys(roles).map(r=><button key={r} onClick={()=>setU(r)} className={`rounded-2xl border p-4 font-black ${u===r?'border-cyan-500 bg-cyan-50':'bg-white'}`}>{r}</button>)}</div><input className="mt-4 w-full rounded-2xl border p-3 font-bold" value={u} readOnly/><input className="mt-3 w-full rounded-2xl border p-3 font-bold" type={show?'text':'password'} value={p} onChange={e=>setP(e.target.value)} placeholder="Clave 123"/><label className="mt-3 flex gap-2 rounded-2xl bg-slate-100 p-3 font-bold"><input type="checkbox" checked={show} onChange={e=>setShow(e.target.checked)}/> Mostrar contraseña</label><Btn onClick={()=>p==='123'?setRole(u):setMsg('Clave incorrecta. Usa 123')} kind="orange"><span className="block w-full py-2">Entrar al sistema</span></Btn>{msg&&<p className="mt-3 rounded-xl bg-amber-50 p-3 font-bold text-amber-900">{msg}</p>}</div></div></div>}
function App(){const [role,setRole]=useState(null),[view,setView]=useState('inicio'),[products,setProducts]=useState([{id:1,n:'Chorrillana Pica Flor',c:'Fondos',p:8990,s:18,min:5},{id:2,n:'Completo Italiano',c:'Rápidos',p:2990,s:42,min:10},{id:3,n:'Lomo a lo Pobre',c:'Fondos',p:9990,s:12,min:4},{id:4,n:'Papas Bravas',c:'Compartir',p:5490,s:24,min:8}]),[orders,setOrders]=useState([]),[cart,setCart]=useState({}),[pays,setPays]=useState([]),[expenses,setExpenses]=useState([]),[logs,setLogs]=useState(['Sistema iniciado']);if(!role)return <Login setRole={(r)=>{setRole(r);setView(roles[r][0])}}/>;const allowed=roles[role];const safe=allowed.includes(view)?view:allowed[0];const totalPays=pays.reduce((a,b)=>a+b.amount,0);const totalExp=expenses.reduce((a,b)=>a+b.amount,0);const addLog=t=>setLogs([new Date().toLocaleTimeString('es-CL')+' · '+role+' · '+t,...logs]);return <div className="tech relative min-h-screen"><div className="relative grid lg:grid-cols-[300px_1fr]"><aside className="min-h-screen bg-white/80 p-4 backdrop-blur border-r"><div className="rounded-[1.7rem] bg-white p-4 shadow-xl flex items-center gap-4"><img src={LOGO} className="floatLogo h-24 w-24 object-contain rounded-2xl bg-white"/><p className="bevel text-xl font-black">La Picá de Picaflor</p></div><div className="mt-4 rounded-3xl bg-slate-950 p-4 text-white"><p className="text-sm text-cyan-300 font-black">Sesión activa</p><p className="text-3xl font-black">{role}</p></div><nav className="mt-4 space-y-2">{allowed.map(k=><button key={k} onClick={()=>setView(k)} className={`w-full rounded-2xl p-3 text-left font-black ${safe===k?'bg-[#0ea7ad] text-white':'bg-white/80'}`}>{labels[k]}</button>)}</nav><button className="mt-4 w-full rounded-2xl bg-red-50 p-3 font-black text-red-700" onClick={()=>setRole(null)}>Cerrar sesión</button><p className="mt-5 text-center text-[10px] font-bold uppercase tracking-[.22em] text-slate-400">Software creado por Emerson Gil</p></aside><main className="p-6 space-y-6"><header className="rounded-[2rem] bg-white/80 p-5 shadow-xl backdrop-blur"><p className="text-xs font-black uppercase tracking-[.3em] text-[#0ea7ad]">Software local / red interna</p><h1 className="bevel text-5xl font-black">{labels[safe]}</h1><p className="font-semibold text-slate-600">Usuarios únicos: ADMIN, CAJA y GARZON. Solo ADMIN configura el sistema.</p></header>{safe==='inicio'&&<Card eyebrow="Resumen" title="Control operativo esencial"><div className="grid md:grid-cols-4 gap-4">{[['Caja',money(totalPays)],['Egresos',money(totalExp)],['Utilidad',money(totalPays-totalExp)],['Pedidos',orders.length]].map(x=><div className="rounded-3xl bg-white p-5 shadow"><p className="font-black text-slate-500">{x[0]}</p><p className="text-2xl font-black text-[#c46e08]">{x[1]}</p></div>)}</div></Card>}{safe==='comandas'&&<Comandas products={products} cart={cart} setCart={setCart} orders={orders} setOrders={setOrders} addLog={addLog}/>} {safe==='cocina'&&<Cocina products={products} orders={orders} setOrders={setOrders} addLog={addLog}/>} {safe==='caja'&&<Caja products={products} orders={orders} setOrders={setOrders} pays={pays} setPays={setPays} addLog={addLog}/>} {safe==='ventas'&&<Ventas products={products} pays={pays}/>} {safe==='egresos'&&<Egresos expenses={expenses} setExpenses={setExpenses} addLog={addLog}/>} {safe==='productos'&&<Productos products={products} setProducts={setProducts} addLog={addLog}/>} {safe==='reportes'&&<Reportes pays={pays} expenses={expenses} orders={orders} products={products}/>} {safe==='config'&&<Config/>} {safe==='trazabilidad'&&<Card eyebrow="Trazabilidad" title="Acciones principales"><div className="space-y-2">{logs.map((l,i)=><p key={i} className="rounded-xl bg-white p-3 font-bold shadow">{l}</p>)}</div></Card>}</main></div></div>}
function Comandas({products,cart,setCart,orders,setOrders,addLog}){const [q,setQ]=useState(''),[type,setType]=useState('Mesa'),[mesa,setMesa]=useState('Mesa 1'),[newM,setNewM]=useState(''),[mesas,setMesas]=useState(['Mesa 1','Mesa 2','Mesa 3','Mesa 4']),[note,setNote]=useState('');const list=products.filter(p=>(p.n+p.c).toLowerCase().includes(q.toLowerCase()));const items=Object.entries(cart);const total=items.reduce((s,[id,c])=>s+(products.find(p=>p.id==id)?.p||0)*c,0);const add=id=>setCart({...cart,[id]:(cart[id]||0)+1});const del=id=>{const n={...cart};delete n[id];setCart(n)};return <Card eyebrow="Garzón" title="Comandas en lista y detalle"><div className="grid xl:grid-cols-2 gap-6"><div className="space-y-4"><div className="rounded-3xl bg-white p-4 shadow"><div className="flex flex-wrap gap-2">{['Mesa','Retiro en local','Delivery','PedidosYa'].map(t=><Btn key={t} onClick={()=>setType(t)} kind={type===t?'cyan':'dark'}>{t}</Btn>)}</div>{type==='Mesa'&&<div className="mt-3 flex flex-wrap gap-2">{mesas.map(m=><button className={`rounded-xl border px-3 py-2 font-black ${m===mesa?'bg-cyan-50 border-cyan-500':''}`} onClick={()=>setMesa(m)}>{m}</button>)}<input className="rounded-xl border px-3 py-2" placeholder="Nueva mesa" value={newM} onChange={e=>setNewM(e.target.value)}/><Btn onClick={()=>{if(newM){setMesas([...mesas,newM]);setMesa(newM);setNewM('')}}}>Agregar</Btn></div>}</div><input className="w-full rounded-3xl bg-slate-950 p-4 font-bold text-white" placeholder="Buscar producto..." value={q} onChange={e=>setQ(e.target.value)}/><div className="max-h-[28rem] overflow-auto rounded-3xl bg-white p-4 shadow space-y-2">{list.map(p=><div className="flex justify-between rounded-2xl border p-3"><div><p className="font-black">{p.n}</p><p className="text-xs font-bold text-slate-500">{p.c} · Stock {p.s}</p></div><div className="flex gap-2 items-center"><b className="text-[#c46e08]">{money(p.p)}</b><Btn onClick={()=>add(p.id)}>+</Btn></div></div>)}</div></div><div className="rounded-3xl bg-slate-950 p-5 text-white shadow-xl"><p className="text-cyan-300 font-black uppercase text-xs tracking-widest">Detalle · {type==='Mesa'?mesa:type}</p><p className="text-3xl font-black mt-2">{money(total)}</p><div className="mt-4 space-y-2">{items.length===0&&<p className="bg-white/10 p-4 rounded-2xl font-bold">No hay productos.</p>}{items.map(([id,c])=>{let p=products.find(x=>x.id==id);return <div className="bg-white/10 p-3 rounded-2xl flex justify-between"><div><b>{p?.n}</b><p className="text-xs">{c} x {money(p?.p)}</p></div><Btn kind="red" onClick={()=>del(id)}>Eliminar</Btn></div>})}</div><input className="mt-4 w-full rounded-2xl bg-white/10 p-3" placeholder="Nota cocina" value={note} onChange={e=>setNote(e.target.value)}/><Btn kind="orange" disabled={!items.length} onClick={()=>{const o={id:Date.now(),table:type==='Mesa'?mesa:type,status:'nuevo',items:items.map(([id,qty])=>({productId:+id,qty})),notes:note};setOrders([o,...orders]);setCart({});setNote('');addLog('Creó comanda '+o.id)}}>Enviar pedido</Btn></div></div></Card>}
function Cocina({products,orders,setOrders,addLog}){const setSt=(id,status)=>{setOrders(orders.map(o=>o.id===id?{...o,status}:o));addLog('Pedido '+id+' '+status)};return <Card eyebrow="Cocina" title="Pedidos recibidos"><div className="grid md:grid-cols-2 gap-4">{orders.filter(o=>o.status!=='pagado').map(o=><div className="rounded-2xl bg-white p-4 shadow"><b>Pedido #{o.id}</b><p>{o.table} · {o.status}</p>{o.items.map(i=><p className="rounded-xl bg-slate-50 p-2 mt-2">{i.qty} x {products.find(p=>p.id===i.productId)?.n}</p>)}{o.status==='nuevo'&&<Btn onClick={()=>setSt(o.id,'preparando')}>En cocina</Btn>}{o.status==='preparando'&&<Btn kind="orange" onClick={()=>setSt(o.id,'listo')}>Pedido listo</Btn>}</div>)}</div></Card>}
function Caja({products,orders,setOrders,pays,setPays,addLog}){const pay=(o,m)=>{const amount=o.items.reduce((s,i)=>s+(products.find(p=>p.id===i.productId)?.p||0)*i.qty,0);setPays([{id:o.id,method:m,amount,at:new Date().toLocaleTimeString('es-CL')},...pays]);setOrders(orders.map(x=>x.id===o.id?{...x,status:'pagado'}:x));addLog('Cobró pedido '+o.id)};return <Card eyebrow="Caja" title="Cobro y medios de pago"><div className="grid xl:grid-cols-2 gap-4">{orders.filter(o=>['listo','entregado'].includes(o.status)).map(o=><div className="rounded-2xl bg-white p-4 shadow"><b>Pedido #{o.id}</b><p>{o.table}</p><div className="flex flex-wrap gap-2 mt-3">{methods.map(m=><Btn onClick={()=>pay(o,m)}>{m}</Btn>)}</div></div>)}<div className="rounded-2xl bg-slate-950 p-4 text-white"><b>Caja del día</b>{pays.map(p=><p className="mt-2">#{p.id} · {p.method} · {money(p.amount)}</p>)}</div></div></Card>}
function Ventas({products,pays}){return <Card eyebrow="Ventas" title="Medios de pago"> <div className="grid md:grid-cols-4 gap-4">{methods.map(m=><div className="bg-white rounded-3xl p-5 shadow"><b>{m}</b><p className="text-2xl font-black text-[#c46e08]">{money(pays.filter(p=>p.method===m).reduce((a,b)=>a+b.amount,0))}</p></div>)}</div></Card>}
function Egresos({expenses,setExpenses,addLog}){const [r,setR]=useState('Compra insumos'),[a,setA]=useState(18500),[m,setM]=useState('Efectivo');return <Card eyebrow="Egresos" title="Registrar egreso"><div className="grid md:grid-cols-4 gap-3"><input className="rounded-2xl border p-3" value={r} onChange={e=>setR(e.target.value)}/><input className="rounded-2xl border p-3" type="number" value={a} onChange={e=>setA(e.target.value)}/><select className="rounded-2xl border p-3" value={m} onChange={e=>setM(e.target.value)}>{methods.map(x=><option>{x}</option>)}</select><Btn kind="orange" onClick={()=>{setExpenses([{reason:r,amount:+a,method:m,date:new Date().toLocaleDateString('es-CL')},...expenses]);addLog('Registró egreso')}}>Registrar</Btn></div>{expenses.map(e=><p className="mt-3 rounded-xl bg-white p-3 font-bold shadow">{e.reason} · {e.method} · -{money(e.amount)}</p>)}</Card>}
function Productos({products,setProducts,addLog}){const [sel,setSel]=useState(products[0]?.id),[f,setF]=useState({n:'',c:'',p:'',s:'',min:''});const p=products.find(x=>x.id===sel);const save=()=>{if(!f.n)return;const np={id:Date.now(),n:f.n,c:f.c||'General',p:+f.p,s:+f.s,min:+f.min};setProducts([np,...products]);setSel(np.id);setF({n:'',c:'',p:'',s:'',min:''});addLog('Agregó producto')};return <Card eyebrow="Inventario" title="Lista y detalle"><div className="grid xl:grid-cols-2 gap-5"><div className="rounded-3xl bg-white p-4 shadow space-y-2">{products.map(x=><button className={`w-full rounded-2xl border p-3 text-left ${sel===x.id?'bg-cyan-50 border-cyan-500':''}`} onClick={()=>setSel(x.id)}><b>{x.n}</b><p>{money(x.p)} · Stock {x.s}/{x.min}</p></button>)}</div><div className="space-y-4"><div className="rounded-3xl bg-slate-950 p-4 text-white grid md:grid-cols-2 gap-2">{['n','c','p','s','min'].map(k=><input className="rounded-xl bg-white/10 p-3" placeholder={{n:'Nombre',c:'Categoría',p:'Precio',s:'Stock',min:'Stock mínimo'}[k]} value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})}/>) }<Btn kind="orange" onClick={save}>Guardar</Btn></div>{p&&<div className="rounded-3xl bg-white p-5 shadow"><h3 className="text-2xl font-black">{p.n}</h3><p>{p.c} · {money(p.p)}</p><p className={p.s<=p.min?'font-black text-red-600':'font-black'}>Stock {p.s} · Mínimo {p.min}</p><Btn kind="green" onClick={()=>{setProducts(products.map(x=>x.id===p.id?{...x,s:Math.max(x.s,x.min*2)}:x));addLog('Rellenó stock')}}>Rellenar</Btn><Btn kind="red" onClick={()=>{setProducts(products.filter(x=>x.id!==p.id));setSel(products[0]?.id);addLog('Eliminó producto')}}>Eliminar</Btn></div>}</div></div></Card>}
function Reportes({pays,expenses,orders}){const inc=pays.reduce((a,b)=>a+b.amount,0),eg=expenses.reduce((a,b)=>a+b.amount,0),txt=`INFORME BASICO - LA PICA DE PICAFLOR\nIngresos: ${money(inc)}\nEgresos: ${money(eg)}\nUtilidad estimada: ${money(inc-eg)}\nPedidos: ${orders.length}`;return <Card eyebrow="Reportes" title="Informe básico" right={<><Btn onClick={()=>window.print()}>Imprimir</Btn><Btn kind="orange" onClick={()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt]));a.download='informe-picaflor.txt';a.click()}}>Descargar</Btn></>}><pre className="rounded-3xl bg-slate-950 p-5 text-white font-bold">{txt}</pre></Card>}
function Config(){return <Card eyebrow="ADMIN" title="Configuración general"><p className="font-bold">Solo ADMIN puede cambiar configuración general, recuperación y claves del sistema.</p></Card>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>

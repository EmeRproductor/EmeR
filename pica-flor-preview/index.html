<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>La Picá de Picaflor POS</title>
<style>
:root{--cyan:#0ea7ad;--orange:#c46e08;--dark:#071923;--panel:rgba(255,255,255,.86)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,Arial,sans-serif;color:#0f172a;background:radial-gradient(circle at 8% 0%,#063a40 0,#0f172a 42%,#241405 100%);min-height:100vh}.bg:before,.bg:after{content:"";position:fixed;inset:0;pointer-events:none}.bg:before{background:radial-gradient(circle at 10% 15%,rgba(14,167,173,.36),transparent 28%),radial-gradient(circle at 90% 25%,rgba(196,110,8,.28),transparent 30%),radial-gradient(circle at 50% 90%,rgba(45,212,191,.18),transparent 32%);animation:glow 10s infinite ease-in-out}.bg:after{background-image:linear-gradient(rgba(14,167,173,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(196,110,8,.14) 1px,transparent 1px);background-size:42px 42px;opacity:.8}.wrap{position:relative;z-index:1}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginGrid{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 1.1fr;gap:28px}.panel{background:var(--panel);border:1px solid rgba(255,255,255,.68);border-radius:34px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.25);backdrop-filter:blur(16px)}.logo{width:138px;height:138px;border-radius:32px;margin:0 auto 18px;background:linear-gradient(135deg,#fff,#e8fdff);display:grid;place-items:center;font-size:54px;box-shadow:0 18px 40px rgba(14,167,173,.28);animation:spinFloat 16s infinite linear}.bevel{text-shadow:0 1px 0 #fff,0 2px 0 rgba(14,167,173,.22),0 12px 28px rgba(14,167,173,.32),0 0 18px rgba(196,110,8,.16)}h1{font-size:48px;line-height:.95;margin:0;text-align:center;font-weight:1000}h2{font-size:30px;margin:0 0 14px;font-weight:1000}.muted{color:#64748b;font-weight:700}.small{font-size:12px;text-transform:uppercase;letter-spacing:.22em;font-weight:900;color:#94a3b8}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.roleBox,.rolePick{border-radius:18px;padding:14px;text-align:center;font-weight:1000}.roleBox{background:#0f172a;color:white}.rolePick{border:1px solid #dbe6ea;background:white;cursor:pointer}.rolePick.active{border-color:var(--cyan);background:#e8fdff}.input,select{width:100%;border:1px solid #dbe6ea;border-radius:18px;padding:14px;font-weight:800;font-size:15px;background:white}.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:1000;cursor:pointer;background:var(--cyan);color:white;box-shadow:0 8px 18px rgba(14,167,173,.22)}.btn.orange{background:var(--orange)}.btn.dark{background:#0f172a}.btn.green{background:#059669}.btn.red{background:#dc2626}.btn.light{background:white;color:#0f172a;border:1px solid #dbe6ea}.btn:disabled{opacity:.4}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:16px;background:rgba(255,255,255,.82);border-right:1px solid rgba(255,255,255,.65);backdrop-filter:blur(14px);z-index:2}.brand{display:flex;gap:12px;align-items:center;background:white;border-radius:26px;padding:14px;box-shadow:0 14px 35px rgba(0,0,0,.12)}.brandLogo{width:92px;height:92px;border-radius:24px;background:linear-gradient(135deg,#fff,#e8fdff);display:grid;place-items:center;font-size:40px;animation:spinFloat 16s infinite linear}.nav{display:grid;gap:9px;margin-top:16px}.nav button{border:0;border-radius:18px;padding:13px;text-align:left;font-weight:1000;cursor:pointer;background:rgba(255,255,255,.85);color:#334155}.nav button.active{background:var(--cyan);color:white}.session{background:#0f172a;color:white;border-radius:26px;padding:18px;margin-top:14px}.main{padding:26px;position:relative;z-index:1}.head{background:rgba(255,255,255,.80);border-radius:30px;padding:22px;margin-bottom:22px;box-shadow:0 20px 50px rgba(0,0,0,.14);backdrop-filter:blur(14px)}.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.65);border-radius:30px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.16);backdrop-filter:blur(14px);margin-bottom:18px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:white;border-radius:24px;padding:18px;box-shadow:0 12px 28px rgba(0,0,0,.08)}.metric b{color:#64748b}.metric p{font-size:24px;margin:6px 0 0;font-weight:1000;color:var(--orange)}.cols{display:grid;grid-template-columns:1fr 1.05fr;gap:18px}.list{background:white;border-radius:24px;padding:14px;max-height:520px;overflow:auto}.row{border:1px solid #e5edf0;border-radius:18px;padding:12px;margin:8px 0;background:white;display:flex;justify-content:space-between;gap:12px;align-items:center}.detail{background:#0f172a;color:white;border-radius:26px;padding:20px}.chip{display:inline-flex;gap:8px;align-items:center;border-radius:999px;padding:7px 10px;background:#e8fdff;color:#075b60;font-weight:1000;font-size:12px;margin:4px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none!important}pre{white-space:pre-wrap;background:#0f172a;color:white;border-radius:24px;padding:18px;font-weight:800}.footer{margin-top:18px;text-align:center;color:#94a3b8;font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}@keyframes glow{50%{filter:hue-rotate(20deg);transform:scale(1.04)}}@keyframes spinFloat{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-8px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-8px)}100%{transform:rotate(360deg) translateY(0)}}@media(max-width:900px){.loginGrid,.app,.cols,.grid4{grid-template-columns:1fr}.side{position:relative;height:auto}.formgrid{grid-template-columns:1fr}h1{font-size:38px}}@media print{.side,.head .btn,.noPrint{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body class="bg"><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);const app=$('#app');
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n||0);
const methods=['Efectivo','Débito','Crédito','Transferencia'];
const roles={ADMIN:['inicio','ventas','caja','comandas','cocina','egresos','productos','reportes','config','trazabilidad'],CAJA:['caja','ventas','cocina'],GARZON:['comandas','cocina']};
const labels={inicio:'Inicio',ventas:'Ventas',caja:'Caja esencial',comandas:'Garzón / comandas',cocina:'Visualización cocina',egresos:'Egresos simples',productos:'Productos / inventario',reportes:'Reportes esenciales',config:'Configuración general',trazabilidad:'Trazabilidad base'};
let role=null, view='inicio', showPass=false;
let products=[{id:1,n:'Chorrillana Pica Flor',c:'Fondos',p:8990,s:18,min:5},{id:2,n:'Completo Italiano',c:'Rápidos',p:2990,s:42,min:10},{id:3,n:'Lomo a lo Pobre',c:'Fondos',p:9990,s:12,min:4},{id:4,n:'Papas Bravas',c:'Compartir',p:5490,s:24,min:8},{id:5,n:'Bebida 350cc',c:'Bebidas',p:1500,s:80,min:20}];
let orders=[{id:1001,table:'Mesa 4',status:'preparando',items:[{productId:1,qty:1},{productId:5,qty:2}],notes:'Sin cebolla'},{id:1002,table:'Mesa 2',status:'listo',items:[{productId:2,qty:2}],notes:''}];
let pays=[{id:998,method:'Débito',amount:15980,at:'12:10'}], expenses=[{reason:'Compra insumos',amount:18500,method:'Efectivo',date:new Date().toLocaleDateString('es-CL')}], logs=['Sistema iniciado · usuarios ADMIN, CAJA y GARZON'];
let cart={}, mesas=['Mesa 1','Mesa 2','Mesa 3','Mesa 4'], selectedProduct=1;
function log(t){logs.unshift(new Date().toLocaleTimeString('es-CL')+' · '+role+' · '+t)}
function login(){const u=$('#user').value,p=$('#pass').value;if(p==='123'){role=u;view=roles[u][0];log('Inicio de sesión');render()}else $('#msg').textContent='Clave incorrecta. Usa 123'}
function renderLogin(){app.innerHTML=`<div class="login"><div class="loginGrid"><section class="panel" style="text-align:center"><div class="logo">🐦</div><h1 class="bevel">La Picá de Picaflor</h1><p class="muted">Software de gestión comercial y operativa para restaurante.</p><div class="roles">${Object.keys(roles).map(r=>`<div class="roleBox">${r}</div>`).join('')}</div><p class="small">Software creado por Emerson Gil</p></section><section class="panel"><h2>Iniciar sesión</h2><div class="roles">${Object.keys(roles).map(r=>`<button class="rolePick ${r==='ADMIN'?'active':''}" onclick="selectUser('${r}',this)">${r}</button>`).join('')}</div><input id="user" class="input" value="ADMIN" readonly><br><br><input id="pass" class="input" type="password" value="123" placeholder="Clave 123"><label style="display:flex;gap:8px;margin:12px 0;font-weight:800"><input type="checkbox" onchange="togglePass(this.checked)"> Mostrar contraseña</label><button class="btn orange" style="width:100%" onclick="login()">Entrar al sistema</button><p id="msg" style="color:#b45309;font-weight:900"></p></section></div></div>`}
function selectUser(u,el){$('#user').value=u;document.querySelectorAll('.rolePick').forEach(b=>b.classList.remove('active'));el.classList.add('active')}function togglePass(v){$('#pass').type=v?'text':'password'}
function render(){if(!role)return renderLogin();const allowed=roles[role];if(!allowed.includes(view))view=allowed[0];app.innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="brandLogo">🐦</div><b class="bevel">La Picá de Picaflor</b></div><div class="session"><span class="small">Sesión activa</span><h2>${role}</h2></div><nav class="nav">${allowed.map(k=>`<button class="${view===k?'active':''}" onclick="view='${k}';render()">${labels[k]}</button>`).join('')}</nav><button class="btn red" style="width:100%;margin-top:14px" onclick="role=null;render()">Cerrar sesión</button><div class="footer">Software creado por Emerson Gil</div></aside><main class="main"><header class="head"><span class="small">Software local / red interna</span><h1 class="bevel" style="text-align:left">${labels[view]}</h1><p class="muted">Usuarios únicos: ADMIN, CAJA y GARZON. Solo ADMIN configura el sistema.</p></header>${screen()}</main></div>`}
function screen(){return ({inicio,ventas,caja,comandas,cocina,egresos,productos:productosView,reportes,config,trazabilidad})[view]()}function totalOrder(o){return o.items.reduce((s,i)=>s+(products.find(p=>p.id==i.productId)?.p||0)*i.qty,0)}
function inicio(){let inc=pays.reduce((s,p)=>s+p.amount,0),eg=expenses.reduce((s,e)=>s+e.amount,0);return `<section class="card"><span class="small">Resumen</span><h2>Control operativo esencial</h2><div class="grid4">${[['Caja',money(inc)],['Egresos',money(eg)],['Utilidad',money(inc-eg)],['Pedidos',orders.length]].map(x=>`<div class="metric"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></section>`}
function comandas(){let q='';return `<section class="card"><span class="small">Garzón</span><h2>Comandas en lista y detalle</h2><div class="cols"><div><div class="list"><div class="actions">${['Mesa','Retiro en local','Delivery','PedidosYa'].map(t=>`<button class="btn light" onclick="document.body.dataset.type='${t}'">${t}</button>`).join('')}</div><div style="margin-top:10px">${mesas.map(m=>`<span class="chip" onclick="document.body.dataset.mesa='${m}'">${m}</span>`).join('')}<input class="input" style="margin-top:8px" id="newMesa" placeholder="Nueva mesa"><button class="btn" onclick="addMesa()">Agregar mesa</button></div></div><input class="input" id="search" placeholder="Buscar producto por nombre..." oninput="filterProducts()" style="margin:14px 0"><div id="plist" class="list">${productRows(products)}</div></div><div class="detail"><span class="small">Detalle comanda</span><h2>${money(cartTotal())}</h2><div id="cart">${cartRows()}</div><input class="input" id="note" placeholder="Nota cocina" style="margin-top:12px"><button class="btn orange" onclick="sendOrder()">Enviar pedido</button></div></div></section>`}
function productRows(list){return list.map(p=>`<div class="row"><div><b>${p.n}</b><p class="muted">${p.c} · Stock ${p.s}</p></div><div><b style="color:var(--orange)">${money(p.p)}</b> <button class="btn" onclick="addCart(${p.id})">+</button></div></div>`).join('')}function filterProducts(){let q=$('#search').value.toLowerCase();$('#plist').innerHTML=productRows(products.filter(p=>(p.n+p.c).toLowerCase().includes(q)))}function addCart(id){cart[id]=(cart[id]||0)+1;render()}function cartTotal(){return Object.entries(cart).reduce((s,[id,q])=>s+(products.find(p=>p.id==id)?.p||0)*q,0)}function cartRows(){let a=Object.entries(cart);if(!a.length)return '<p class="muted">No hay productos agregados.</p>';return a.map(([id,q])=>{let p=products.find(x=>x.id==id);return `<div class="row" style="background:rgba(255,255,255,.1);color:white;border-color:rgba(255,255,255,.1)"><div><b>${p.n}</b><p>${q} x ${money(p.p)}</p></div><button class="btn red" onclick="delete cart[${id}];render()">Eliminar</button></div>`}).join('')}function addMesa(){let v=$('#newMesa').value.trim();if(v&&!mesas.includes(v)){mesas.push(v);render()}}function sendOrder(){if(!Object.keys(cart).length)return;let o={id:Date.now(),table:document.body.dataset.mesa||'Mesa 1',status:'nuevo',items:Object.entries(cart).map(([id,qty])=>({productId:+id,qty})),notes:$('#note')?.value||''};orders.unshift(o);cart={};log('Creó comanda #'+o.id);render()}
function cocina(){return `<section class="card"><span class="small">Cocina</span><h2>Pedidos recibidos</h2><div class="cols">${orders.filter(o=>o.status!=='pagado').map(o=>`<div class="list"><h3>Pedido #${o.id}</h3><p>${o.table} · <b>${o.status}</b></p>${o.items.map(i=>`<p class="row">${i.qty} x ${products.find(p=>p.id==i.productId)?.n}</p>`).join('')}<div class="actions">${o.status==='nuevo'?`<button class="btn" onclick="status(${o.id},'preparando')">En cocina</button>`:''}${o.status==='preparando'?`<button class="btn orange" onclick="status(${o.id},'listo')">Pedido listo</button>`:''}</div></div>`).join('')}</div></section>`}function status(id,s){orders=orders.map(o=>o.id==id?{...o,status:s}:o);log('Pedido #'+id+' '+s);render()}
function caja(){return `<section class="card"><span class="small">Caja</span><h2>Cobro de pedidos</h2><div class="cols"><div>${orders.filter(o=>['listo','entregado'].includes(o.status)).map(o=>`<div class="list"><h3>Pedido #${o.id}</h3><p>${o.table} · ${money(totalOrder(o))}</p><div class="actions">${methods.map(m=>`<button class="btn" onclick="pay(${o.id},'${m}')">${m}</button>`).join('')}</div></div>`).join('')||'<p class="list">No hay pedidos pendientes de cobro.</p>'}</div><div class="detail"><h2>Caja del día</h2>${pays.map(p=>`<p>${p.id} · ${p.method} · ${money(p.amount)}</p>`).join('')}</div></div></section>`}function pay(id,m){let o=orders.find(x=>x.id==id);pays.unshift({id,method:m,amount:totalOrder(o),at:new Date().toLocaleTimeString('es-CL')});orders=orders.map(x=>x.id==id?{...x,status:'pagado'}:x);log('Cobró pedido #'+id);render()}
function ventas(){return `<section class="card"><span class="small">Ventas</span><h2>Medios de pago</h2><div class="grid4">${methods.map(m=>`<div class="metric"><b>${m}</b><p>${money(pays.filter(p=>p.method==m).reduce((s,p)=>s+p.amount,0))}</p></div>`).join('')}</div></section>`}
function egresos(){return `<section class="card"><span class="small">Egresos</span><h2>Registrar egreso</h2><div class="formgrid"><input id="er" class="input" value="Compra insumos"><input id="ea" type="number" class="input" value="18500"><select id="em">${methods.map(m=>`<option>${m}</option>`).join('')}</select><button class="btn orange" onclick="addExpense()">Registrar</button></div>${expenses.map(e=>`<p class="row"><b>${e.reason}</b><span>${e.method} · -${money(e.amount)}</span></p>`).join('')}</section>`}function addExpense(){expenses.unshift({reason:$('#er').value,amount:+$('#ea').value,method:$('#em').value,date:new Date().toLocaleDateString('es-CL')});log('Registró egreso');render()}
function productosView(){let p=products.find(x=>x.id==selectedProduct)||products[0];return `<section class="card"><span class="small">Inventario</span><h2>Lista y detalle de productos</h2><div class="cols"><div class="list">${products.map(x=>`<button class="row" style="width:100%;text-align:left" onclick="selectedProduct=${x.id};render()"><div><b>${x.n}</b><p class="muted">${x.c}</p></div><span>${money(x.p)}<br><b style="color:${x.s<=x.min?'#dc2626':'#64748b'}">Stock ${x.s}/${x.min}</b></span></button>`).join('')}</div><div><div class="detail"><h3>Agregar producto</h3><input id="pn" class="input" placeholder="Nombre"><input id="pc" class="input" placeholder="Categoría"><input id="pp" class="input" type="number" placeholder="Precio"><input id="ps" class="input" type="number" placeholder="Stock"><input id="pm" class="input" type="number" placeholder="Stock mínimo"><button class="btn orange" onclick="addProduct()">Guardar</button></div>${p?`<div class="list"><h2>${p.n}</h2><p>${p.c} · ${money(p.p)}</p><p><b>Stock actual:</b> ${p.s} · <b>Mínimo:</b> ${p.min}</p>${p.s<=p.min?'<p style="color:#dc2626;font-weight:1000">Alerta: producto para reponer</p>':''}<button class="btn green" onclick="refill(${p.id})">Rellenar</button> <button class="btn red" onclick="delProduct(${p.id})">Eliminar</button></div>`:''}</div></div></section>`}function addProduct(){let n=$('#pn').value;if(!n)return;products.unshift({id:Date.now(),n,c:$('#pc').value||'General',p:+$('#pp').value,s:+$('#ps').value,min:+$('#pm').value});selectedProduct=products[0].id;log('Agregó producto');render()}function refill(id){products=products.map(p=>p.id==id?{...p,s:Math.max(p.s,p.min*2)}:p);log('Rellenó stock');render()}function delProduct(id){products=products.filter(p=>p.id!=id);selectedProduct=products[0]?.id;log('Eliminó producto');render()}
function reportes(){let inc=pays.reduce((s,p)=>s+p.amount,0),eg=expenses.reduce((s,e)=>s+e.amount,0);let txt=`INFORME BASICO - LA PICA DE PICAFLOR\nFecha: ${new Date().toLocaleDateString('es-CL')}\nIngresos: ${money(inc)}\nEgresos: ${money(eg)}\nUtilidad estimada: ${money(inc-eg)}\nPedidos registrados: ${orders.length}`;return `<section class="card"><span class="small">Reportes</span><h2>Informe básico</h2><button class="btn" onclick="window.print()">Imprimir</button> <button class="btn orange" onclick="downloadReport()">Descargar</button><pre id="rep">${txt}</pre></section>`}function downloadReport(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#rep').textContent],{type:'text/plain'}));a.download='informe-picaflor.txt';a.click()}
function config(){return `<section class="card"><span class="small">ADMIN</span><h2>Configuración general</h2><p><b>Solo ADMIN</b> puede cambiar configuración general, recuperación y claves del sistema.</p><p>No existe creación de usuarios adicionales.</p></section>`}function trazabilidad(){return `<section class="card"><span class="small">Trazabilidad</span><h2>Acciones principales</h2>${logs.map(l=>`<p class="row"><b>${l}</b></p>`).join('')}</section>`}
render();
</script>
</body>
</html>
